[menu]
title=第一人称

[field.enabled]
type=bool
label=启用第一人称模组
description=快捷键可在游戏原生「按键绑定」设置中自定义。
default=true

[field.fov]
type=number
label=视野大小
description=垂直视野角度（度）。
default=85
min=40
max=120
step=1

[field.sensitivity]
type=number
label=视角灵敏度
description=第一人称视角移动灵敏度倍率。
default=2
min=0.2
max=8
step=0.1

[field.height_variation]
type=bool
label=随动作变换高度
description=视线跟随角色的跑动与蹲伏动作上下起伏。
default=false

[field.head_look_binding]
type=bool
label=头颈转动与镜头绑定
description=镜头绑定至真实头部位置，转动视角时跟随头颈关节弧线运动。
default=false

[field.head_translation]
type=bool
label=跟随头部位移
description=视线跟随角色的头部动作前后与左右晃动。
default=false

[field.head_rotation]
type=bool
label=跟随头部转动
description=视线跟随角色的头部动作旋转。
default=false

[field.head_tilt]
type=bool
label=跟随头部倾斜
description=视线跟随角色的头部侧倾动作。
default=false

[field.head_strength]
type=number
label=头部转动与倾斜幅度
description=头部动作转动与倾斜效果的强度倍率。
default=0.4
min=0
max=1
step=0.05

[field.eye_offset]
type=number
label=眼睛高度偏移
description=相对头部骨骼高度的上下微调（米）。
default=0.08
min=-0.2
max=0.3
step=0.01

[field.forward_offset]
type=number
label=视点前移
description=视点相对头部中心的前移距离（米）。
default=0.08
min=0
max=0.3
step=0.01

[field.smoothing]
type=number
label=头部跟随平滑度
description=平滑动画位移（秒），0 为直接跟随。
default=0.08
min=0
max=0.4
step=0.01

[field.rotation_smoothing]
type=number
label=转动视点稳定
description=抑制镜头朝向抖动（秒），会带来等量的转头延迟。0 为关闭。
default=0.015
min=0
max=0.1
step=0.005

[field.turn_threshold]
type=number
label=身体转身触发角度
description=视角与身体朝向夹角超过此角度时触发转身（度）。设为 180 可关闭自动转身。
default=90
min=0
max=180
step=1

[field.native_body_turn]
type=bool
label=原生迈步转身
description=转身时触发角色的原生迈步动画。
default=false

[field.turn_in_place]
type=bool
label=原生转身保持原地
description=迈步转身时保持原地，消除动画位移。
default=true

[field.turn_speed]
type=number
label=身体转身速度
description=角色平滑转身的速度（度/秒）。
default=360
min=90
max=1080
step=30

[field.hide_self]
type=bool
label=隐藏头部模型
description=第一人称下隐藏头部与头发模型，避免遮挡视线。
default=true

[field.show_body]
type=bool
label=低头可见身体
description=低头观察时显示身体与四肢。
default=true

[field.fun_effects]
type=bool
label=角色趣味视野
description=为特定角色启用专属视觉效果。
default=false

[field.tangtang_patch]
type=bool
label=汤汤 · 眼罩
description=左侧视野圆弧形眼罩遮挡效果。
default=true

[field.endmin_scan]
type=bool
label=管理员 · 抑制器扫描
description=周期性地形扫描波纹与光带视觉效果。
default=true

[field.scan_period]
type=number
label=扫描周期
description=扫描波纹的循环周期（秒）。
default=3
min=1
max=10
step=0.25

[field.dapan_sunglasses]
type=bool
label=大潘 · 墨镜
description=墨镜滤镜调暗画面。
default=true

[field.sunglasses_darkness]
type=number
label=墨镜深度
description=墨镜滤镜暗化深度。
default=0.35
min=0.05
max=0.75
step=0.05

[field.relax_blocked_input]
type=bool
label=输入被封锁时保持
description=角色处于落地缓冲、硬直等输入封锁状态时不交还相机。
default=false

[field.relax_temp_camera]
type=bool
label=临时相机接管时保持
description=游戏启用通用临时相机控制器时仍强行留在第一人称。
default=false

[field.relax_cursor]
type=bool
label=鼠标光标出现时保持
description=光标可见（Alt 观察、部分界面）时仍留在第一人称。
default=false

[field.relax_phase_level]
type=bool
label=界面层顶上来时保持
description=顶层 UI 不是关卡层时仍留在第一人称。
default=false

[field.diagnose_view_gates]
type=bool
label=视角接管诊断
description=相机被让出时在日志里记录是哪一项状态导致的。
default=false

[field.relax_cinematic]
type=bool
label=角色演出状态时保持
description=对话、滑索、脚本演出等角色被标记为演出中时仍留在第一人称。
default=false

[field.relax_controller]
type=bool
label=强行覆盖游戏相机控制器
description=游戏把相机交给别的控制器时，仍由本模组直写主相机。会让演出镜头失效，出问题就关掉。
default=false

[field.hold_on_view_hide]
type=bool
label=视图控件隐藏时保持
description=游戏临时隐藏第一人称相机控件（对话、滑索等）时，短时间内不交还相机。
default=true
